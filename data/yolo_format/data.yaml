# YOLO Dataset Configuration
# Dataset root. Set this to an absolute local path for direct Ultralytics
# commands. The exporter supplies an absolute path at runtime.
path: null

# Train, val, test sets as relative paths to path/
train: images/train
val: images/val
test: images/test

# Number of classes
nc: 7

# Class names (indexed 0-6)
names:
  0: alligator crack
  1: block crack
  2: longitudinal crack
  3: other corruption
  4: pothole
  5: repair
  6: transverse crack
